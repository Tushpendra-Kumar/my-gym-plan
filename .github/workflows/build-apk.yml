name: Build GymPlan APK & OTA Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Web Assets into Android www
        run: node sync-assets.js

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug/Release APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Read OTA Version & Notes
        id: meta
        run: |
          VERSION=$(node -p "require('./ota-manifest.json').version")
          NOTES=$(node -p "require('./ota-manifest.json').notes")
          SHORT_SHA=${GITHUB_SHA::7}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "notes=${NOTES}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release with GymPlan.apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "GymPlan v${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.sha }})"
          body: |
            🚀 **My GYM Plan Automatic Cloud Build**

            - **Version:** `v${{ steps.meta.outputs.version }}`
            - **Commit:** `${{ steps.meta.outputs.sha }}`
            - **Changes:** ${{ steps.meta.outputs.notes }}
            - **Live OTA:** Web updates apply automatically inside **Personal Dashboard ➔ App Updates**.

            Download `GymPlan.apk` below if installing fresh or updating native Android features.
          files: |
            android/app/build/outputs/apk/debug/GymPlan.apk
            ota-manifest.json

      - name: Auto-Sync to CodeByTushu Website
        if: success()
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/GymPlan.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE_BYTES=$(stat -c%s "$APK_PATH")
            SIZE_MB=$(echo "scale=1; $SIZE_BYTES / 1048576" | bc 2>/dev/null || node -e "console.log(($SIZE_BYTES/1048576).toFixed(1))")MB
          else
            SIZE_MB="5.8 MB"
          fi

          curl -s -X POST https://codebytushu.com/api/apps/sync-github.php \
            -H "Content-Type: application/json" \
            -H "X-Sync-Token: cbt_gym_sync_2026_a98f12" \
            -d "{\"slug\":\"irontracker-gym\",\"version\":\"v${{ steps.meta.outputs.version }}\",\"file_size\":\"$SIZE_MB\",\"min_android\":\"Android 8.0+\",\"status_badge\":\"⚡ 100% Offline & Online Sync • ☁️ Cloud Backup • 🛡️ Zero Ads & Ironclad Privacy\",\"changelog\":\"${{ steps.meta.outputs.notes }}\"}"

